services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patrol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patrol"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 号段分配/补录均为短事务，保留默认死锁检测即可；lock_timeout 仅用于
    # 同段补录排队时快速失败，由 API 端 SET LOCAL 下发，不要求库级配置。
    command:
      - "postgres"
      - "-c"
      - "lock_timeout=10s"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/patrol
      ORDER_PREFIX: "OFF-"
      MIN_QUANTITY: "1"
      MAX_QUANTITY: "50"
      LOCK_TIMEOUT_MS: "10000"
    ports:
      - "8000:8000"
